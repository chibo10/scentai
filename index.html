<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ScentAI — L'Âme des Parfums</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #e2c97e;
      --cream: #FAF8F4;
      --dark: #1a1814;
      --mid: #4a4540;
      --border: rgba(201,168,76,0.25);
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--dark);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    /* Subtle grain texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* HEADER */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.6rem 3rem;
      border-bottom: 1px solid var(--border);
      background: rgba(250,248,244,0.92);
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 0.35em;
      color: var(--dark);
    }
    .logo span { color: var(--gold); }

    .tagline-header {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      color: var(--mid);
      text-transform: uppercase;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8rem 2rem 5rem;
      position: relative;
      z-index: 1;
    }

    .hero-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards 0.2s;
    }
    .hero-badge::before, .hero-badge::after {
      content: '';
      display: block;
      width: 30px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    .star { color: var(--gold); font-size: 0.8rem; }

    h1 {
      font-family: 'Cinzel', serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 9vw, 7rem);
      letter-spacing: 0.08em;
      line-height: 1;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.4s;
    }
    h1 .ai { color: var(--gold); font-weight: 400; }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.25rem;
      color: var(--mid);
      letter-spacing: 0.05em;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.6s;
    }

    /* SEARCH BOX */
    .search-card {
      width: 100%;
      max-width: 560px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(4px);
      padding: 2.2rem 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 0.8s;
    }

    .search-card input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      color: var(--dark);
      text-align: center;
      padding: 0.5rem 0;
      letter-spacing: 0.05em;
      transition: border-color 0.3s;
    }
    .search-card input::placeholder { color: #b0a898; font-style: italic; }
    .search-card input:focus { border-bottom-color: var(--gold); }

    .btn-analyser {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--dark);
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.8rem 2.5rem;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, border-color 0.3s;
    }
    .btn-analyser:hover {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    /* EXAMPLES */
    .examples-section {
      margin-top: 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1s;
    }

    .examples-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--mid);
    }

    .examples-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
    }

    .pill {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--mid);
      border: 1px solid var(--border);
      padding: 0.4rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.3s, color 0.3s;
      letter-spacing: 0.03em;
    }
    .pill:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* RESULT AREA */
    .result-area {
      width: 100%;
      max-width: 660px;
      margin-top: 2.5rem;
      border-top: 1px solid var(--border);
      padding-top: 2rem;
      display: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .result-area.visible {
      display: block;
      opacity: 1;
    }
    .result-title {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 1rem;
      text-align: center;
    }
    .result-content {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      color: var(--mid);
      line-height: 1.8;
      text-align: center;
      font-style: italic;
      white-space: pre-wrap;
    }
    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 0.4rem;
      padding: 1rem 0;
    }
    .loading-dots span {
      width: 5px; height: 5px;
      background: var(--gold);
      border-radius: 50%;
      animation: dot 1.2s infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }

    /* DECORATIVE LINE */
    .deco-line {
      width: 60px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      margin: 2rem auto 0;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      header { padding: 1.2rem 1.5rem; }
      .search-card { padding: 1.5rem 1.2rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">S C E N T<span>AI</span></div>
    <div class="tagline-header">L'Âme des Parfums</div>
  </header>

  <main class="hero">

    <div class="hero-badge">
      <span class="star">✦</span>
      Intelligence Olfactive
      <span class="star">✦</span>
    </div>

    <h1>S C E N T<span class="ai">AI</span></h1>
    <p class="subtitle">Découvrez l'âme de chaque parfum</p>

    <div class="search-card">
      <input
        type="text"
        id="parfumInput"
        placeholder="Entrez un parfum... ex: Sauvage Dior, N°5 Chanel..."
      />
      <button class="btn-analyser" onclick="analyser()">Analyser</button>
    </div>

    <div class="examples-section">
      <div class="examples-label">Exemples</div>
      <div class="examples-pills">
        <div class="pill" onclick="setParfum('Sauvage Dior')">Sauvage Dior</div>
        <div class="pill" onclick="setParfum('N°5 Chanel')">N°5 Chanel</div>
        <div class="pill" onclick="setParfum('Baccarat Rouge 540')">Baccarat Rouge 540</div>
        <div class="pill" onclick="setParfum('Aventus Creed')">Aventus Creed</div>
        <div class="pill" onclick="setParfum('La Vie Est Belle')">La Vie Est Belle</div>
      </div>
    </div>

    <div class="result-area" id="resultArea">
      <div class="result-title">✦ Analyse Olfactive ✦</div>
      <div class="result-content" id="resultContent"></div>
      <div class="deco-line"></div>
    </div>

  </main>

  <script>
    function setParfum(name) {
      document.getElementById('parfumInput').value = name;
      analyser();
    }

    async function analyser() {
      const input = document.getElementById('parfumInput').value.trim();
      if (!input) return;

      const area = document.getElementById('resultArea');
      const content = document.getElementById('resultContent');

      area.style.display = 'block';
      setTimeout(() => area.style.opacity = '1', 10);
      content.innerHTML = `<div class="loading-dots"><span></span><span></span><span></span></div>`;

      try {
        const response = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "claude-sonnet-4-20250514",
            max_tokens: 1000,
            system: `Tu es ScentAI, un expert en parfumerie de haute volée avec une plume poétique et raffinée. 
Quand on te soumet un parfum, tu rédiges une analyse olfactive courte (150-200 mots) en français, élégante et évocatrice.
Structure ton analyse en 3 parties fluides : la première impression (tête), le cœur olfactif, et le sillage (fond).
Inclus les notes principales, la famille olfactive, l'émotion ou l'univers qu'il évoque.
Ton style est celui d'un poète parfumeur : précis, sensuel, mémorable. Pas de bullet points, juste de la prose sublime.`,
            messages: [{ role: "user", content: `Analyse le parfum : ${input}` }]
          })
        });

        const data = await response.json();
        const text = data.content?.map(b => b.text || '').join('') || "Parfum non reconnu.";
        content.innerHTML = `<span>${text}</span>`;

      } catch (err) {
        content.innerHTML = `<span style="color:#b0a898">Une erreur est survenue. Veuillez réessayer.</span>`;
      }
    }

    document.getElementById('parfumInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') analyser();
    });
  </script>

</body>
</html>
